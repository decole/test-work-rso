# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

parameters:
    app.timezone: '%env(default:app.default_timezone:APP_TIMEZONE)%'
    app.default_timezone: 'Europe/Moscow'

# You can redefine the coefficients and sums here.
#    app.insurance.daily_coefficients:
#        30000: 0.6
#        50000: 0.8

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

# To redefine coefficients and sums, specify the parameter to be redefined here.
#    App\Service\Calculator\Coefficient\ConfigurableDailyCoefficientResolver:
#        arguments:
#            $coefficients: '%app.insurance.daily_coefficients%'
