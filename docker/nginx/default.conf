server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32m;

    # Symfony front controller: route every request through index.php
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # FastCGI to the php-fpm container
    location ~ ^/index\.php(/|$) {
        # Resolve the "app" service at request time via Docker's DNS, so nginx
        # survives app container restarts and the startup-order race.
        resolver 127.0.0.11 valid=10s;
        set $php_fpm app:9000;
        fastcgi_pass $php_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # The front controller is reachable only via /index.php
        internal;
    }

    # Never expose any other PHP file
    location ~ \.php$ {
        return 404;
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    access_log off;
    error_log /var/log/nginx/error.log;
}
