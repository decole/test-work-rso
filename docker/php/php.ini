; Custom PHP settings for the Symfony 8 container (loaded via zz-symfony.ini)

; --- General ---
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = UTC
expose_php = Off
serialize_precision = -1

; --- Realpath cache (speeds up autoloading) ---
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- Opcache ---
; Disable by Dev
; In development we keep validate_timestamps enabled so code changes are picked up.
; opcache.enable = 1
; opcache.memory_consumption = 256
; opcache.interned_strings_buffer = 16
; opcache.max_accelerated_files = 20000
; opcache.validate_timestamps = 1
; opcache.revalidate_freq = 0
